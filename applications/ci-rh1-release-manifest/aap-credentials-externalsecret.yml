---
# ExternalSecret definitions for AAP credentials
# These fetch credentials from HashiCorp Vault or another secrets backend
# Configure your ClusterSecretStore appropriately
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aap-dev-credentials
  namespace: ci-rh1-release-manifest
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: aap-dev-credentials
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: secret/data/aap/dev
        property: host
    - secretKey: username
      remoteRef:
        key: secret/data/aap/dev
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/aap/dev
        property: password
