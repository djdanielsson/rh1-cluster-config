kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: devworkspace-controller-podman-scc-binding
subjects:
  - kind: ServiceAccount
    name: devworkspace-controller-serviceaccount
    namespace: openshift-devspaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # This role is automatically generated by OpenShift for every SCC
  name: system:openshift:scc:nested-podman-scc
