apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quay-rh1-ee-robotaccount
  namespace: ee-builder-ci
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-sdk-rh1
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson_b64 | b64dec }}"
  dataFrom:
    - extract:
        key: quay-rh1-ee-robotaccount
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None