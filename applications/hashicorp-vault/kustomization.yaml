apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hashicorp-vault
commonAnnotations:
  argocd.argoproj.io/sync-wave: "-2"
resources:
  - hashicorp-vault-namespace.yml
  - vault-route.yml
  - vault-audit-configmap.yml
  - vault-jwt-auth-configmap.yml
  - vault-kubernetes-auth-configmap.yml
helmCharts:
  - name: vault
    includeCRDs: true
    releaseName: vault
    namespace: hashicorp-vault
    version: 0.29.1
    repo: https://helm.releases.hashicorp.com
    valuesInline:
      global:
        openshift: true
      server:
        enabled: true
        standalone:
          enabled: true
          config: |
            ui = true
            listener "tcp" {
              tls_disable = 1
              address = "[::]:8200"
              cluster_address = "[::]:8201"
            }
            storage "raft" {
              path = "/vault/data"
            }
            disable_mlock = true
        dataStorage:
          enabled: true
          size: 10Gi
        auditStorage:
          enabled: true
          size: 5Gi
        service:
          enabled: true
          type: ClusterIP
        route:
          enabled: false
      ui:
        enabled: true
        serviceType: ClusterIP
