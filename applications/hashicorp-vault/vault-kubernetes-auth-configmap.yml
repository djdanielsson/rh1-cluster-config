apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-kubernetes-auth-tekton
  namespace: hashicorp-vault
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  configure-kubernetes-auth.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    : "${VAULT_ADDR:?}"
    vault auth enable kubernetes || true
    vault write auth/kubernetes/config \
      kubernetes_host="https://kubernetes.default.svc:443"
    vault write auth/kubernetes/role/external-secrets \
      bound_service_account_names=external-secrets \
      bound_service_account_namespaces=external-secrets-operator \
      policies=rh1-platform-read \
      ttl=1h
    vault write auth/kubernetes/role/ci-rh1-ee \
      bound_service_account_names=pipeline \
      bound_service_account_namespaces=ci-rh1-ee \
      policies=rh1-ci-tekton \
      ttl=1h
    vault write auth/kubernetes/role/ci-rh1-custom-collection \
      bound_service_account_names=pipeline \
      bound_service_account_namespaces=ci-rh1-custom-collection \
      policies=rh1-ci-tekton \
      ttl=1h
    vault write auth/kubernetes/role/ci-rh1-release-manifest \
      bound_service_account_names=pipeline \
      bound_service_account_namespaces=ci-rh1-release-manifest \
      policies=rh1-ci-tekton \
      ttl=1h
    vault write auth/kubernetes/role/ci-rh1-aap-config-as-code \
      bound_service_account_names=pipeline \
      bound_service_account_namespaces=ci-rh1-aap-config-as-code \
      policies=rh1-ci-tekton \
      ttl=1h
  README: |
    ESO uses role: external-secrets
    Tekton CI namespaces use roles matching namespace name
