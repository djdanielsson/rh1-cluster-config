# yaml-language-server: $schema=https://www.schemastore.org/api/json/catalog.json
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cosign-sign-blob
spec:
  description: >-
    Sign a file blob (e.g. release manifest) with Cosign and write signature artifacts.
  workspaces:
    - name: source
      description: Workspace containing the blob to sign.
    - name: cosign-keys
      description: Workspace containing cosign signing key.
      readOnly: true
  params:
    - name: BLOB_PATH
      description: Relative path to the blob within the source workspace.
      type: string
    - name: COSIGN_IMAGE
      description: Container image that provides the cosign CLI.
      type: string
      default: ghcr.io/sigstore/cosign/cosign:v2.4.1
    - name: KEY_FILE
      description: Path to the cosign private key within the cosign-keys workspace.
      type: string
      default: cosign.key
  results:
    - name: signature-path
      description: Relative path to the generated signature file.
    - name: certificate-path
      description: Relative path to the generated certificate file.
  steps:
    - name: cosign-sign-blob
      workingDir: $(workspaces.source.path)
      image: $(params.COSIGN_IMAGE)
      env:
        - name: COSIGN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cosign-signing-key
              key: password
              optional: true
      script: |
        #!/bin/sh
        set -eu
        BLOB="$(params.BLOB_PATH)"
        SIG="${BLOB}.sig"
        CERT="${BLOB}.cert"
        KEY_PATH="$(workspaces.cosign-keys.path)/$(params.KEY_FILE)"
        if [ ! -f "$BLOB" ]; then
          echo "Blob not found: $BLOB"
          exit 1
        fi
        cosign sign-blob --key "$KEY_PATH" --bundle "${BLOB}.bundle" --yes "$BLOB" > "$SIG"
        echo -n "$SIG" > "$(results.signature-path.path)"
        echo -n "$CERT" > "$(results.certificate-path.path)"
