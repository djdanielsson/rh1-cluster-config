apiVersion: tekton.dev/v1 # or tekton.dev/v1beta1
kind: Task
metadata:
  name: molecule
spec:
  description: |-
    This task runs molecule tests for a given scenario.
  params:
  - name: molecule-command
    description: Molecule command to run.
    default: "test"
    type: string
  - name: molecule-scenario
    description: Molecule scenario to run.
    default: "default"
    type: string
  - name: collection-bundle
    description: Collection bundle to install into the molecule environment
    default: ""
    type: string
  - name: python-requirements-file
    description: Python requirements file to install into the molecule environment
    default: ""
    type: string
  steps:
  - name: molecule # Need to get python deps installed, run from $(workspaces.source.path)
    image: ghcr.io/ansible/community-ansible-dev-tools:v25.9.0
    env:
    - name: MOLECULE_SCENARIO
      value: $(params.molecule-scenario)
    workingDir: $(workspaces.source.path)
    script: |
      #!/usr/bin/env sh
      set -eu

      # Molecule does not automatically install python dependencies, so we need to do it here
      if [ -f "$(params.python-requirements-file)" ] ; then
        pip install -r "molecule/$(params.python-requirements-file)"
      fi

      # If a collection bundle is provided, install it into the molecule environment
      if [ -n "$(params.collection-bundle)" ] ; then
        ansible-galaxy collection install -f "$(params.collection-bundle)"
      fi

      # Run Molecule
      molecule $(params.molecule-command) -s "$(params.molecule-scenario)"
  workspaces:
  - name: source
    description: Workspace to debug