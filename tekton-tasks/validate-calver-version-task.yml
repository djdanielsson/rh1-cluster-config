# yaml-language-server: $schema=https://www.schemastore.org/api/json/catalog.json
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: validate-calver-version
  labels:
    app.kubernetes.io/component: shared-tasks
spec:
  description: >-
    Validates a version string follows the CalVer YY.M.D-PATCH format.
    Used by release pipelines to ensure consistent versioning.
  params:
    - name: VERSION
      description: Version string to validate (e.g., 26.1.5-0)
      type: string
  results:
    - name: valid
      description: Whether the version is valid (true/false)
    - name: year
      description: Extracted year component (YY)
    - name: month
      description: Extracted month component (M)
    - name: day
      description: Extracted day component (D)
    - name: patch
      description: Extracted patch component
  steps:
    - name: validate
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      script: |
        #!/usr/bin/env bash
        set -e

        VERSION="$(params.VERSION)"
        echo "Validating CalVer version: $VERSION"

        # Regex for YY.M.D-PATCH format
        # YY: 2 digits (year)
        # M: 1-12 (no leading zero)
        # D: 1-31 (no leading zero)
        # PATCH: 0+ (patch number)
        REGEX='^[0-9]{2}\.(1[0-2]|[1-9])\.(3[01]|[12][0-9]|[1-9])-[0-9]+$'

        if [[ ! "$VERSION" =~ $REGEX ]]; then
          echo "❌ Invalid version format: $VERSION"
          echo ""
          echo "Expected format: YY.M.D-PATCH"
          echo "Examples:"
          echo "  26.1.5-0   (January 5, 2026, initial release)"
          echo "  26.1.5-1   (January 5, 2026, first patch)"
          echo "  26.12.25-0 (December 25, 2026, initial release)"
          echo ""
          echo "Rules:"
          echo "  - Year: 2 digits (e.g., 26 for 2026)"
          echo "  - Month: 1-12, no leading zero"
          echo "  - Day: 1-31, no leading zero"
          echo "  - Patch: 0 or higher, separated by hyphen"
          echo "false" > $(results.valid.path)
          exit 1
        fi

        # Extract components (split on . and -)
        IFS='.-' read -r YEAR MONTH DAY PATCH <<< "$VERSION"

        echo "✅ Valid CalVer version: $VERSION"
        echo "  Year:  $YEAR (20$YEAR)"
        echo "  Month: $MONTH"
        echo "  Day:   $DAY"
        echo "  Patch: $PATCH"

        # Write results
        echo "true" > $(results.valid.path)
        echo -n "$YEAR" > $(results.year.path)
        echo -n "$MONTH" > $(results.month.path)
        echo -n "$DAY" > $(results.day.path)
        echo -n "$PATCH" > $(results.patch.path)
